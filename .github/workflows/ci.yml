name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      NOX_VERSION: v2.1.186
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - os: linux
            arch: x64
            runner: ubuntu-latest
          # Linux ARM64
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          # macOS Apple Silicon ARM64
          - os: macos
            arch: arm64
            runner: macos-latest
          # Windows x64
          - os: windows
            arch: x64
            runner: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install NOX (Linux / macOS)
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! curl -fsSL https://raw.githubusercontent.com/mburakmmm/nox-lang/main/install.sh | bash; then
            echo "install.sh failed via CDN; downloading via GitHub API..."
            ASSET="linux-x64"
            [ "$RUNNER_ARCH" = "ARM64" ] && [ "$RUNNER_OS" = "Linux" ] && ASSET="linux-arm64"
            [ "$RUNNER_OS" = "macOS" ] && ASSET="macos-arm64"
            STAGE="nox-lang-${NOX_VERSION:-v2.1.186}-${ASSET}"
            TMP_DIR=$(mktemp -d)
            ASSET_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/mburakmmm/nox-lang/releases/tags/${NOX_VERSION:-v2.1.186}" | jq -r ".assets[] | select(.name == \"${STAGE}.tar.gz\") | .id")
            curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                 -H "Accept: application/octet-stream" \
                 -o "$TMP_DIR/${STAGE}.tar.gz" \
                 "https://api.github.com/repos/mburakmmm/nox-lang/releases/assets/${ASSET_ID}"
            mkdir -p "$HOME/.nox-lang"
            tar xzf "$TMP_DIR/${STAGE}.tar.gz" -C "$TMP_DIR"
            cp -R "$TMP_DIR/${STAGE}/." "$HOME/.nox-lang/"
            chmod +x "$HOME/.nox-lang/bin/"*
          fi
          echo "$HOME/.nox-lang/bin" >> $GITHUB_PATH

      - name: Install NOX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          & pwsh -Command { irm https://raw.githubusercontent.com/mburakmmm/nox-lang/main/install.ps1 | iex }
          if ($LASTEXITCODE -ne 0) {
            Write-Host "install.ps1 failed via CDN; downloading via GitHub API..."
            $headers = @{
              "Authorization" = "Bearer $env:GITHUB_TOKEN"
              "Accept" = "application/octet-stream"
              "User-Agent" = "Quartz-CI"
            }
            $relHeaders = @{
              "Authorization" = "Bearer $env:GITHUB_TOKEN"
              "User-Agent" = "Quartz-CI"
            }
            $v = if ($env:NOX_VERSION) { $env:NOX_VERSION } else { "v2.1.186" }
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/mburakmmm/nox-lang/releases/tags/$v" -Headers $relHeaders
            $asset = $rel.assets | Where-Object { $_.name -eq "nox-lang-$v-windows-x64.zip" }
            $tmpDir = Join-Path $env:TEMP ([System.Guid]::NewGuid().ToString())
            New-Item -ItemType Directory -Force -Path $tmpDir | Out-Null
            $zipPath = Join-Path $tmpDir "nox-windows.zip"
            Invoke-RestMethod -Uri "https://api.github.com/repos/mburakmmm/nox-lang/releases/assets/$($asset.id)" -Headers $headers -OutFile $zipPath
            $targetDir = Join-Path $env:USERPROFILE ".nox-lang"
            New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
            Expand-Archive -Path $zipPath -DestinationPath $tmpDir -Force
            Copy-Item -Recurse -Force (Join-Path $tmpDir "nox-lang-$v-windows-x64\*") $targetDir
          }
          "$env:USERPROFILE\.nox-lang\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify NOX toolchain
        run: |
          noxc version

      - name: Type check Quartz facade & desktop accelerators
        run: |
          noxc check quartz.nox
          noxc check accel/json_fast.nox
          noxc check accel/pcre2_assert.nox
          noxc check accel/xxhash_digest.nox
          noxc check cli/main.nox

      - name: Run Quartz test suite
        env:
          QUARTZ_REQUIRE_SQLITE: ${{ runner.os != 'Windows' && '1' || '0' }}
        run: |
          noxc test

      - name: Run backend matrix test with QBE
        run: |
          noxc run --backend qbe tests/backend_matrix_test.nox

      - name: Run backend matrix test with LLVM
        if: runner.os != 'Windows'
        run: |
          noxc run --backend llvm tests/backend_matrix_test.nox

      - name: Verify Quartz CLI commands & SBOM
        run: |
          noxc run cli/main.nox -- version
          noxc run cli/main.nox -- help
          noxc run cli/main.nox -- property --cases 10
          noxc run cli/main.nox -- load --requests 10
          noxc run cli/main.nox -- contract
          noxc run cli/main.nox -- property --target tests/property_test.nox
          noxc run cli/main.nox -- test tests/baseline_test.nox
          noxc run cli/main.nox -- test tests --pattern "*baseline*"
          noxc run cli/main.nox -- test fixtures/tag_demo.nox --tag smoke
          noxc run cli/main.nox -- test fixtures/tag_demo.nox --exclude-tag slow
          noxc run cli/main.nox -- test fixtures --tag smoke
          noxc run cli/main.nox -- replay fixtures/custom_replay_artifact.json
          noxc sbom

      - name: Verify Clean Consumer Package Consumption (POSIX)
        if: runner.os != 'Windows'
        run: |
          TMP_CONS=$(mktemp -d)
          cat > "$TMP_CONS/nox.json" <<EOF
          {"name": "consumer_smoke", "entry": "main.nox", "requires": [{"alias": "quartz", "repo": "${{ github.workspace }}", "ref": "${{ github.sha }}"}]}
          EOF
          cat > "$TMP_CONS/main.nox" <<'EOF'
          from quartz.core.assert import assert_eq_int, assert_matches_regex
          from quartz.core.prng import Prng
          from quartz.core.types import STATUS_PASS
          from quartz.core.fixture import TempDirFixture
          from quartz.contract.types import ContractCheckResult

          assert_eq_int(2 + 2, 4, "consumer assert")
          assert_matches_regex("^PASS$", STATUS_PASS, "consumer regex")
          rng: Prng = Prng(42)
          v: int = rng.next_range(1, 100)
          assert_eq_int(v >= 1 and v <= 100, True, "consumer prng")
          print("clean consumer smoke: PASS")
          EOF
          (cd "$TMP_CONS" && noxc fetch && noxc check main.nox && noxc run main.nox)
          rm -rf "$TMP_CONS"

      - name: Verify Clean Consumer Package Consumption (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP ("quartz_consumer_" + [System.Guid]::NewGuid().ToString("N").Substring(0,8))
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $repoPath = "${{ github.workspace }}" -replace '\\','/'
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          $noxJson = "{`"name`": `"consumer_smoke`", `"entry`": `"main.nox`", `"requires`": [{ `"alias`": `"quartz`", `"repo`": `"$repoPath`", `"ref`": `"${{ github.sha }}`" }]}"
          [System.IO.File]::WriteAllText((Join-Path $tmp "nox.json"), $noxJson, $utf8NoBom)
          $mainNox = "from quartz.core.assert import assert_eq_int, assert_matches_regex`nfrom quartz.core.prng import Prng`nfrom quartz.core.types import STATUS_PASS`nassert_eq_int(2 + 2, 4, `"consumer assert`")`nassert_matches_regex(`"^PASS$`", STATUS_PASS, `"consumer regex`")`nrng: Prng = Prng(42)`nv: int = rng.next_range(1, 100)`nassert_eq_int(v >= 1 and v <= 100, True, `"consumer prng`")`nprint(`"clean consumer smoke: PASS`")`n"
          [System.IO.File]::WriteAllText((Join-Path $tmp "main.nox"), $mainNox, $utf8NoBom)
          Push-Location $tmp
          try {
            noxc fetch
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            noxc check main.nox
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            noxc run main.nox
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
            Remove-Item -Recurse -Force $tmp
          }
