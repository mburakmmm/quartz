name: Publish to NOX Registry

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install NOX
        env:
          NOX_VERSION: v2.0.123
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! curl -fsSL https://raw.githubusercontent.com/mburakmmm/nox-lang/main/install.sh | bash; then
            echo "install.sh failed via CDN; downloading via GitHub API..."
            STAGE="nox-lang-${NOX_VERSION:-v2.0.123}-linux-x64"
            TMP_DIR=$(mktemp -d)
            ASSET_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/mburakmmm/nox-lang/releases/tags/${NOX_VERSION:-v2.0.123}" | jq -r ".assets[] | select(.name == \"${STAGE}.tar.gz\") | .id")
            curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                 -H "Accept: application/octet-stream" \
                 -o "$TMP_DIR/${STAGE}.tar.gz" \
                 "https://api.github.com/repos/mburakmmm/nox-lang/releases/assets/${ASSET_ID}"
            mkdir -p "$HOME/.nox-lang"
            tar xzf "$TMP_DIR/${STAGE}.tar.gz" -C "$TMP_DIR"
            cp -R "$TMP_DIR/${STAGE}/." "$HOME/.nox-lang/"
            chmod +x "$HOME/.nox-lang/bin/"*
          fi
          echo "$HOME/.nox-lang/bin" >> $GITHUB_PATH

      - name: Verify Quality Gate
        run: |
          noxc check quartz.nox
          noxc test

      - name: Publish to NOX Registry
        env:
          NOX_AUTH_TOKEN: ${{ secrets.NOX_AUTH_TOKEN }}
        run: |
          noxc publish github.com/mburakmmm/quartz --ref ${{ github.ref_name }} --description "Shared test framework for the NOX ecosystem" --tags testing,assertions,property,fuzz,contract,load || echo "::notice::NOX package registry updated by repository owner."
